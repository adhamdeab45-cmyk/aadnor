services:
  - type: web
    name: adnor-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: FIREBASE_DATABASE_URL
        value: https://adhamnnn-8a4d2-default-rtdb.firebaseio.com
      - key: ALLOWED_ORIGINS
        value: https://aadnor.onrender.com,https://adnor.onrender.com
      - key: ADN_ENERGY_ADS_LIVE
        value: false
